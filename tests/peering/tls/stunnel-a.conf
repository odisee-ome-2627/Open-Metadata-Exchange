; Sidecar of node-a: TLS in front of INN and TLS towards node-b. Mutual TLS: both
; sides must show a certificate, and only the pinned certificate of the other side
; is accepted. Test use only.
foreground = yes
debug = info
sslVersionMin = TLSv1.2

; Outgoing: innfeed of node-a connects to tls-a:11901 (plain NNTP, inside the Docker
; network). The traffic goes to the sidecar of node-b over TLS.
[to-node-b]
client = yes
accept = 11901
connect = tls-b:5119
delay = yes
cert = /certs/tls-a.crt
key = /certs/tls-a.key
CAfile = /certs/tls-b.crt
verifyPeer = yes
checkHost = tls-b

; Incoming: the sidecar of node-b connects here over TLS. After the handshake the
; traffic goes to INN of node-a as plain NNTP. INN sees the address of this sidecar.
[from-node-b]
accept = 5119
connect = node-a:119
delay = yes
cert = /certs/tls-a.crt
key = /certs/tls-a.key
CAfile = /certs/tls-b.crt
verifyPeer = yes
