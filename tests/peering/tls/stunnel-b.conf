; Sidecar of node-b: TLS in front of INN and TLS towards node-a. Mutual TLS: both
; sides must show a certificate, and only the pinned certificate of the other side
; is accepted. Test use only.
foreground = yes
debug = info
sslVersionMin = TLSv1.2

; Outgoing: innfeed of node-b connects to tls-b:11901 (plain NNTP, inside the Docker
; network). The traffic goes to the sidecar of node-a over TLS.
[to-node-a]
client = yes
accept = 11901
connect = tls-a:5119
delay = yes
cert = /certs/tls-b.crt
key = /certs/tls-b.key
CAfile = /certs/tls-a.crt
verifyPeer = yes
checkHost = tls-a

; Incoming: the sidecar of node-a connects here over TLS. After the handshake the
; traffic goes to INN of node-b as plain NNTP. INN sees the address of this sidecar.
[from-node-a]
accept = 5119
connect = node-b:119
delay = yes
cert = /certs/tls-b.crt
key = /certs/tls-b.key
CAfile = /certs/tls-a.crt
verifyPeer = yes
